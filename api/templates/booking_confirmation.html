<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 480px; margin: auto; padding: 20px; }
        h2 { color: #c14f71; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Appointment is Confirmed</h2>
        <p>Hi {{ name }},</p>

        <p>Thank you for booking your <strong>{{ style_name }}</strong> appointment.</p>

        <p><strong>Date:</strong> {{ datetime }}</p>

        <p>If you have questions or need to reschedule, reply to this email.</p>

        <p style="margin-top:25px;">— Hair Salon Team</p>
    </div>
</body>
</html>
